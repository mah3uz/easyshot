<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<!--if:ready-->
<meta property="og:title" content="{{title}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:image" content="{{poster_url}}">
<meta name="twitter:card" content="summary_large_image">
<!--if:video--><meta property="og:type" content="video.other"><meta property="og:video" content="{{media_url}}"><meta property="og:video:type" content="{{mime}}"><!--end:video-->
<!--end:ready-->
<link rel="icon" href="@@favicon@@">
@@js@@
@@css@@
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">@@logo@@</svg>
<div class="page-bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="bar">
<a class="brand" href="{{home_url}}"><svg viewBox="0 0 512 512" width="32" height="32" aria-hidden="true" focusable="false"><use href="#logo"/></svg><span>easyshot</span></a>
<button type="button" class="icon-btn js-only" data-theme-toggle aria-label="Theme: system. Click to change." title="Theme: system">
<svg class="i-system" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
<svg class="i-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
<svg class="i-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
</button>
</header>

<main id="main">
<!--if:ready-->
<div class="intro rise">
<h1>{{title}}</h1>
<p class="meta">
<!--if:image--><span>Screenshot</span><!--end:image--><!--if:video--><span>Recording</span><!--end:video-->
<span>{{width}} × {{height}}</span>
<!--if:expires--><time class="expires" datetime="{{expires_at}}" data-expires="{{expires_at}}" hidden></time><!--end:expires-->
</p>
</div>
<div class="stage rise" style="--d: 0.08s">
<div class="window">
<div class="chrome" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="file">{{download_name}}</span></div>
<div class="view">
<!--if:image--><img class="media" data-fit src="{{media_url}}" width="{{width}}" height="{{height}}" alt="{{title}}"><!--end:image-->
<!--if:video--><video class="media" data-fit src="{{media_url}}" poster="{{poster_url}}" width="{{width}}" height="{{height}}" controls playsinline preload="metadata" aria-label="{{title}}"></video><!--end:video-->
</div>
</div>
</div>
<div class="actions rise" style="--d: 0.16s">
<a class="btn btn-primary" href="{{media_url}}" download="{{download_name}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"/></svg>Download</a>
<button type="button" class="btn btn-ghost" data-copy data-url="{{page_url}}" hidden><svg class="i-link" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><svg class="i-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-copy-label>Copy link</span></button>
<span class="sr-only" role="status" data-copy-status></span>
</div>
<!--end:ready-->
<!--if:uploading-->
<div class="intro">
<h1>{{title}}</h1>
<p class="meta"><span class="live">Uploading</span></p>
</div>
<div class="stage stage-fixed" data-reload>
<div class="window">
<div class="chrome" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="file">uploading…</span></div>
<div class="view wait">
<span class="spinner" aria-hidden="true"></span>
<p><strong>Still uploading</strong><span>This page shows it when it is done.</span></p>
</div>
</div>
</div>
<!--end:uploading-->
<!--if:gone-->
<div class="gone rise">
<div class="gone-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
<h1>This share is gone</h1>
<p>It expired or was deleted.</p>
<a class="btn btn-ghost" href="{{home_url}}">Visit easyshot</a>
</div>
<!--end:gone-->
</main>

<footer class="made">
<a href="{{home_url}}">Made with <svg viewBox="0 0 512 512" width="16" height="16" aria-hidden="true" focusable="false"><use href="#logo"/></svg> easyshot</a>
</footer>
</body>
</html>

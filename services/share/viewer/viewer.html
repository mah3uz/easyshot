<script>
(() => {
const KEY = 'es-share-theme'
const root = document.documentElement
root.classList.add('js')
let choice = 'system'
try {
const saved = localStorage.getItem(KEY)
if (saved === 'light' || saved === 'dark') choice = saved
} catch {}
const apply = (next) => {
choice = next
root.dataset.choice = next
if (next === 'system') delete root.dataset.theme
else root.dataset.theme = next
}
apply(choice)
const save = () => {
try {
if (choice === 'system') localStorage.removeItem(KEY)
else localStorage.setItem(KEY, choice)
} catch {}
}
const relative = new Intl.RelativeTimeFormat('en', { numeric: 'always' })
const expiresText = (ms) => {
if (ms <= 0) return 'Expired'
const minutes = ms / 60000
if (minutes < 60) return `Expires ${relative.format(Math.max(1, Math.round(minutes)), 'minute')}`
const hours = minutes / 60
if (hours < 24) return `Expires ${relative.format(Math.round(hours), 'hour')}`
return `Expires ${relative.format(Math.round(hours / 24), 'day')}`
}
document.addEventListener('DOMContentLoaded', () => {
const toggle = document.querySelector('[data-theme-toggle]')
const label = () => {
toggle.title = `Theme: ${choice}`
toggle.setAttribute('aria-label', `Theme: ${choice}. Click to change.`)
}
label()
toggle.addEventListener('click', (event) => {
const next = { system: 'light', light: 'dark', dark: 'system' }[choice]
const run = () => {
apply(next)
save()
label()
}
if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return run()
const x = event.clientX || innerWidth - 40
const y = event.clientY || 40
const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y))
document.startViewTransition(run).ready.then(() => {
root.animate(
{ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },
{ duration: 650, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', pseudoElement: '::view-transition-new(root)' },
)
})
})
for (const media of document.querySelectorAll('[data-fit]')) {
const w = parseInt(media.getAttribute('width'), 10)
const h = parseInt(media.getAttribute('height'), 10)
const stage = media.closest('.stage')
if (!(w > 0 && h > 0) || !stage) continue
stage.style.setProperty('--fw', `min(100%, ${w}px, (100cqh - 2px) * ${(w / h).toFixed(4)} + 2px)`)
stage.style.setProperty('--nw', `${w}px`)
stage.style.setProperty('--nh', `${h + 2}px`)
stage.style.setProperty('--ar', (h / w).toFixed(4))
stage.dataset.fitted = ''
if (media.tagName !== 'IMG' || !window.ResizeObserver) continue
new ResizeObserver(([entry]) => {
const { width, height } = entry.contentRect
const shown = Math.min(w, width, (height * w) / h)
stage.toggleAttribute('data-tall', shown < 0.45 * Math.min(width, w))
}).observe(stage)
}
const full = document.querySelector('[data-full]')
const opener = document.querySelector('[data-full-open]')
const source = document.querySelector('img.media')
if (full && opener && source && full.showModal) {
const frame = source.closest('.window')
const big = full.querySelector('img')
const fade = [full.querySelector('.full-bg'), full.querySelector('.full-close')]
const w = parseInt(source.getAttribute('width'), 10)
const h = parseInt(source.getAttribute('height'), 10)
const ease = getComputedStyle(root).getPropertyValue('--ease-out-soft').trim() || 'ease-out'
const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches
let moving = []
let closing = false
const fit = () => {
const shown = Math.min(w, innerWidth, (innerHeight * w) / h)
full.toggleAttribute('data-tall', shown < 0.45 * Math.min(w, innerWidth))
}
const move = (opening, duration) => {
const a = frame.getBoundingClientRect()
const b = big.getBoundingClientRect()
const scale = a.width / b.width
const r = getComputedStyle(big).borderTopLeftRadius
const cut = Math.max(0, b.height - a.height / scale)
const order = (k) => (opening ? k : [...k].reverse())
const timing = { duration, easing: ease, fill: 'forwards' }
moving = [
big.animate(
{
transform: order([`translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${scale})`, 'none']),
clipPath: order([`inset(0 0 ${cut}px 0 round ${r})`, `inset(0 0 0 0 round ${r})`]),
},
timing,
),
...fade.map((el) => el.animate({ opacity: order([0, 1]) }, timing)),
]
return Promise.all(moving.map((m) => m.finished)).catch(() => {})
}
const hide = async () => {
if (closing || !full.open) return
closing = true
moving.forEach((m) => m.cancel())
if (!still()) await move(false, 320)
full.close()
}
opener.addEventListener('click', async () => {
if (!big.getAttribute('src')) {
if (w > 0 && h > 0) {
big.width = w
big.height = h
}
big.alt = source.alt
big.src = source.currentSrc || source.src
await big.decode().catch(() => {})
}
closing = false
if (innerWidth > root.clientWidth) root.style.scrollbarGutter = 'stable'
fit()
full.showModal()
if (!still()) move(true, 460)
})
full.addEventListener('cancel', (event) => {
event.preventDefault()
hide()
})
full.addEventListener('click', (event) => {
if (!event.target.closest('img')) hide()
})
full.addEventListener('close', () => {
moving.forEach((m) => m.cancel())
moving = []
closing = false
root.style.scrollbarGutter = ''
opener.focus({ preventScroll: true })
})
source.addEventListener('click', () => opener.click())
addEventListener('resize', () => full.open && fit())
}
const title = document.querySelector('main h1')
if (title && title.textContent.length > 60) title.classList.add('long')
const expires = document.querySelector('[data-expires]')
const at = expires ? Date.parse(expires.dataset.expires) : NaN
if (!Number.isNaN(at)) {
expires.textContent = expiresText(at - Date.now())
expires.title = new Date(at).toLocaleString()
expires.hidden = false
}
const copy = document.querySelector('[data-copy]')
if (copy && navigator.clipboard) {
const text = copy.querySelector('[data-copy-label]')
const status = document.querySelector('[data-copy-status]')
let timer
copy.hidden = false
copy.addEventListener('click', async () => {
let ok = true
try {
await navigator.clipboard.writeText(copy.dataset.url)
} catch {
ok = false
}
copy.dataset.state = ok ? 'copied' : 'failed'
text.textContent = ok ? 'Copied' : 'Could not copy'
status.textContent = ok ? 'Link copied' : 'Could not copy the link'
clearTimeout(timer)
timer = setTimeout(() => {
delete copy.dataset.state
text.textContent = 'Copy link'
status.textContent = ''
}, 1600)
})
}
if (document.querySelector('[data-reload]')) setTimeout(() => location.reload(), 5000)
})
})()
</script>

:root {
--bg: #f6fafb;
--bg-2: #edf4f6;
--surface: #ffffff;
--surface-2: #f2f7f8;
--line: rgba(7, 47, 60, 0.1);
--line-strong: rgba(7, 47, 60, 0.18);
--fg: #0a2631;
--fg-2: #44606b;
--fg-3: #7590a0;
--accent: #14a39a;
--accent-2: #1388a6;
--accent-soft: rgba(33, 189, 176, 0.12);
--grad: linear-gradient(135deg, #62edd4 0%, #21bdb0 45%, #1388a6 100%);
--gt-1: #0f8f88;
--gt-2: #1388a6;
--gt-3: #3b6fd1;
--gt-at: 60%;
--grad-text: linear-gradient(120deg, var(--gt-1) 0%, var(--gt-2) var(--gt-at), var(--gt-3) 100%);
--sh-sm: 0 1px 2px rgba(4, 48, 64, 0.06), 0 1px 1px rgba(4, 48, 64, 0.04);
--sh: 0 10px 30px -12px rgba(4, 48, 64, 0.22), 0 2px 6px rgba(4, 48, 64, 0.06);
--sh-lg: 0 40px 90px -30px rgba(4, 48, 64, 0.38), 0 12px 30px -12px rgba(4, 48, 64, 0.16);
--glow: rgba(33, 189, 176, 0.25);
--code-bg: #0b3341;
--pg-1: #f2f9fa;
--pg-2: #f6fafb;
--pg-3: #f5f9fb;
--pg-4: #f3f8fa;
--page-grad: linear-gradient(180deg, var(--pg-1) 0%, var(--pg-2) 38%, var(--pg-3) 70%, var(--pg-4) 100%);
--blob-1: rgba(98, 237, 212, 0.22);
--blob-2: rgba(19, 136, 166, 0.12);
--blob-3: rgba(120, 140, 255, 0.1);
color-scheme: light;
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme='light']) {
--bg: #04212b;
--bg-2: rgba(160, 230, 225, 0.035);
--surface: rgba(12, 60, 76, 0.55);
--surface-2: rgba(22, 82, 100, 0.45);
--line: rgba(160, 230, 225, 0.1);
--line-strong: rgba(160, 230, 225, 0.2);
--fg: #e8f7f6;
--fg-2: #a3c3c8;
--fg-3: #6f959c;
--accent: #3fd9c4;
--accent-2: #21bdb0;
--accent-soft: rgba(98, 237, 212, 0.12);
--gt-1: #8ff5e3;
--gt-2: #3fd9c4;
--gt-3: #5fb8ff;
--gt-at: 45%;
--sh-sm: 0 1px 2px rgba(0, 12, 18, 0.4);
--sh: 0 12px 34px -12px rgba(0, 12, 18, 0.7), 0 2px 6px rgba(0, 12, 18, 0.3);
--sh-lg: 0 50px 100px -30px rgba(0, 10, 16, 0.85), 0 16px 40px -16px rgba(0, 10, 16, 0.6);
--glow: rgba(63, 217, 196, 0.22);
--code-bg: #031a22;
--pg-1: #073543;
--pg-2: #04252f;
--pg-3: #03212b;
--pg-4: #052a37;
--blob-1: rgba(33, 189, 176, 0.28);
--blob-2: rgba(19, 136, 166, 0.34);
--blob-3: rgba(76, 110, 245, 0.16);
color-scheme: dark;
}
}
:root[data-theme='dark'] {
--bg: #04212b;
--bg-2: rgba(160, 230, 225, 0.035);
--surface: rgba(12, 60, 76, 0.55);
--surface-2: rgba(22, 82, 100, 0.45);
--line: rgba(160, 230, 225, 0.1);
--line-strong: rgba(160, 230, 225, 0.2);
--fg: #e8f7f6;
--fg-2: #a3c3c8;
--fg-3: #6f959c;
--accent: #3fd9c4;
--accent-2: #21bdb0;
--accent-soft: rgba(98, 237, 212, 0.12);
--gt-1: #8ff5e3;
--gt-2: #3fd9c4;
--gt-3: #5fb8ff;
--gt-at: 45%;
--sh-sm: 0 1px 2px rgba(0, 12, 18, 0.4);
--sh: 0 12px 34px -12px rgba(0, 12, 18, 0.7), 0 2px 6px rgba(0, 12, 18, 0.3);
--sh-lg: 0 50px 100px -30px rgba(0, 10, 16, 0.85), 0 16px 40px -16px rgba(0, 10, 16, 0.6);
--glow: rgba(63, 217, 196, 0.22);
--code-bg: #031a22;
--pg-1: #073543;
--pg-2: #04252f;
--pg-3: #03212b;
--pg-4: #052a37;

--blob-2: rgba(19, 136, 166, 0.34);

:root {
--font-sans: 'Inter', 'Inter Fallback', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
--font-display: 'Inter Tight', 'Inter Tight Fallback', 'Inter', 'Inter Fallback', ui-sans-serif, system-ui, sans-serif;
--ease-out-soft: cubic-bezier(0.22, 1, 0.36, 1);
--ease-hover: cubic-bezier(0.16, 1, 0.3, 1);
--radius-card: 12px;
}
.page-bg {
position: fixed;
inset: 0;
z-index: -1;
overflow: hidden;
background: var(--page-grad);
pointer-events: none;
}
.page-bg i {
position: absolute;
margin: -270px;
background: radial-gradient(
closest-side,
var(--c) calc(100% - 540px),
color-mix(in srgb, var(--c) 97.7%, transparent) calc(100% - 450px),
color-mix(in srgb, var(--c) 84.1%, transparent) calc(100% - 360px),
color-mix(in srgb, var(--c) 50%, transparent) calc(100% - 270px),
color-mix(in srgb, var(--c) 15.9%, transparent) calc(100% - 180px),
color-mix(in srgb, var(--c) 2.3%, transparent) calc(100% - 90px),
transparent
);
will-change: transform;
}
.page-bg .b1 {
--c: var(--blob-1);
width: calc(60vmax + 540px);
height: calc(60vmax + 540px);
top: -25vmax;
left: -15vmax;
animation: drift1 38s ease-in-out infinite alternate;
}
.page-bg .b2 {
--c: var(--blob-2);
width: calc(55vmax + 540px);
height: calc(55vmax + 540px);
top: -10vmax;
right: -25vmax;
animation: drift2 46s ease-in-out infinite alternate;
}
.page-bg .b3 {
--c: var(--blob-3);
width: calc(50vmax + 540px);
height: calc(50vmax + 540px);
bottom: -30vmax;
left: 20vmax;
animation: drift1 52s ease-in-out infinite alternate-reverse;
}
@keyframes drift1 {
to {
transform: translate(12vmax, 10vmax) scale(1.15);
}
}
@keyframes drift2 {
to {
transform: translate(-14vmax, 14vmax) scale(0.9);
}
}
@supports not selector(::-webkit-scrollbar) {
@layer base {
* {
scrollbar-width: thin;
scrollbar-color: var(--scroll-thumb, var(--line-strong)) transparent;
}
}
}
::-webkit-scrollbar {
width: 10px;
height: 10px;
background: transparent;
}
::-webkit-scrollbar-corner {
background: transparent;
}
::-webkit-scrollbar-thumb {
border: 2px solid transparent;
border-radius: 999px;
background: var(--scroll-thumb, var(--line-strong)) padding-box;
}
::-webkit-scrollbar-thumb:hover {
background-color: var(--scroll-thumb-hover, var(--fg-3));
}
*,
*::before,
*::after {
box-sizing: border-box;
}
html {
-webkit-text-size-adjust: 100%;
}
body {
margin: 0;
min-height: 100vh;
min-height: 100svh;
display: flex;
flex-direction: column;
overflow-x: hidden;
background: var(--bg);
color: var(--fg);
font: 16px/1.5 var(--font-sans);
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
h1 {
margin: 0;
font: 700 clamp(26px, 3.4vw, 40px) / 1.12 var(--font-display);
letter-spacing: -0.025em;
text-wrap: balance;
overflow-wrap: anywhere;
}
h1.long {
font-size: clamp(22px, 2.6vw, 30px);
line-height: 1.2;
}
p {
margin: 0;
}
:focus-visible {
outline: 2px solid var(--accent);
outline-offset: 3px;
border-radius: 8px;
}
::selection {
background: var(--accent-soft);
}
.sr-only {
position: absolute;
width: 1px;
height: 1px;
overflow: hidden;
clip-path: inset(50%);
white-space: nowrap;
}
.sprite {
position: absolute;
width: 0;
height: 0;
overflow: hidden;
}
.js-only {
display: none !important;
}
.bar {
width: 100%;
max-width: 1180px;
margin: 0 auto;
height: 68px;
padding: 0 16px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 16px;
}
.brand {
display: flex;
align-items: center;
gap: 10px;
color: inherit;
text-decoration: none;
font: 700 19px/1 var(--font-display);
letter-spacing: -0.025em;
}
.brand svg {
width: 32px;
height: 32px;
transition: transform 400ms var(--ease-hover);
}
.brand:hover svg {
transform: rotate(-6deg) scale(1.1);
}
.icon-btn {
width: 38px;
height: 38px;
padding: 0;
place-items: center;
border: 1px solid var(--line);
border-radius: 999px;
background: var(--surface);
color: var(--fg-2);
box-shadow: var(--sh-sm);
cursor: pointer;
transition:
border-color 300ms ease,
color 300ms ease;
}
.js .icon-btn {
display: grid !important;
}
.icon-btn:hover {
border-color: var(--accent);
color: var(--fg);
}
.icon-btn svg {
grid-area: 1 / 1;
display: none;
}
:root:not([data-choice]) .i-system,
[data-choice='system'] .i-system,
[data-choice='light'] .i-light,
[data-choice='dark'] .i-dark {
display: block;
}
main {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
width: 100%;
padding: 20px 16px 40px;
overflow-x: clip;
}
.intro {
max-width: 820px;
text-align: center;
}
.meta {
margin-top: 12px;
display: flex;
flex-wrap: wrap;
align-items: center;
justify-content: center;
gap: 6px 0;
color: var(--fg-3);
font-size: 14px;
font-variant-numeric: tabular-nums;
}
.meta > * + *::before {
content: '';
display: inline-block;
width: 3px;
height: 3px;
margin: 0 10px;
border-radius: 50%;
background: currentColor;
vertical-align: middle;
opacity: 0.7;
}
.expires {
color: var(--accent);
font-weight: 600;
}
.live {
display: inline-flex;
align-items: center;
gap: 8px;
color: var(--accent);
font-weight: 600;
}
.live::after {
content: '';
order: -1;
width: 7px;
height: 7px;
border-radius: 50%;
background: currentColor;
animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
50% {
opacity: 0.25;
}
}
.stage {
margin-top: 28px;
width: var(--fw, fit-content);
min-width: min(100%, 300px);
max-width: min(100%, 1132px);
}
.stage-fixed {
--fw: min(100%, 720px);
}
main:has(.stage[data-fitted]) {
container-type: inline-size;
justify-content: center;
}
.stage[data-fitted] {
flex: 1 1 0;
min-height: min(200px, var(--nh));
max-height: calc(min(100cqw, 1132px, var(--nw)) * var(--ar) + 2px);
width: 100%;
container-type: size;
display: grid;
place-items: center;
}
.stage[data-fitted] .window {
width: var(--fw);
}
.stage[data-tall] .window {
width: min(100%, var(--nw));
}
.window {
position: relative;
border: 1px solid var(--line-strong);
border-radius: var(--radius-card);
background: var(--surface);
box-shadow: var(--sh-lg);
}
.window::before {
content: '';
position: absolute;
inset: -12% -8%;
z-index: -1;
background: radial-gradient(closest-side, var(--glow), transparent);
pointer-events: none;
}
.view {
display: grid;
overflow: clip;
border-radius: calc(var(--radius-card) - 1px);
background: var(--surface-2);
}
.media {
display: block;
justify-self: center;
max-width: 100%;
height: auto;
}
.stage[data-fitted] .media {
width: 100%;
}
.stage[data-tall] .media {
height: calc(100cqh - 2px);
object-fit: cover;
object-position: top;
}
.stage[data-tall] .view::after {
content: '';
grid-area: 1 / 1;
align-self: end;
height: min(28%, 128px);
background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 88%, transparent));
pointer-events: none;
}
.js img.media {
cursor: zoom-in;
}
.view .media,
.view-full {
grid-area: 1 / 1;
}
.view-full {
position: sticky;
top: 12px;
z-index: 1;
align-self: start;
justify-self: end;
margin: 12px;
backdrop-filter: blur(8px);
}
.view-full svg,
.full-close svg {
display: block;
}
@media (hover: hover) and (pointer: fine) and (min-width: 640px) {
.view-full {
opacity: 0;
transition:
opacity 300ms var(--ease-out-soft),
border-color 300ms ease,
color 300ms ease;
}
.view:hover .view-full,
.view-full:focus-visible {
opacity: 1;
}
}
body:has(.full[open]) {
overflow: hidden;
}
.full {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
max-width: none;
max-height: none;
margin: 0;
padding: 0;
border: 0;
overflow: hidden;
background: none;
color: var(--fg);
}
.full::backdrop {
background: none;
}
.full-bg {
position: absolute;
inset: 0;
background: color-mix(in srgb, var(--code-bg) 90%, transparent);
backdrop-filter: blur(8px);
}
.full-fit {
--m: 16px;
--scroll-thumb: color-mix(in srgb, var(--fg-3) 60%, transparent);
position: relative;
height: 100%;
overflow-y: auto;
overscroll-behavior: contain;
display: grid;
place-items: center;
padding: var(--m);
}
.full-fit img {
display: block;
width: auto;
height: auto;
max-width: 100%;
max-height: calc(100dvh - 2 * var(--m));
border: 1px solid var(--line-strong);
border-radius: var(--radius-card);
background: var(--surface-2);
box-shadow: var(--sh-lg);
transform-origin: 0 0;
}
.full[data-tall] .full-fit {
align-items: start;
padding-top: calc(var(--m) + 54px);
}
.full[data-tall] .full-fit img {
max-height: none;
}
.full-close {
position: absolute;
top: 16px;
right: 16px;
}
video.media {
background: #000;
}
.actions {
margin-top: 28px;
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 12px;
}
.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 10px;
height: 48px;
padding: 0 22px;
border: 1px solid transparent;
border-radius: 999px;
font: 600 15px/1 var(--font-sans);
text-decoration: none;
white-space: nowrap;
cursor: pointer;
backface-visibility: hidden;
transition:
translate 400ms var(--ease-hover),
transform 400ms var(--ease-hover),
box-shadow 300ms ease,
border-color 300ms ease,
color 300ms ease;
}
.btn[hidden] {
display: none;
}
.btn:hover {
translate: 0 -2px;
}
.btn:active {
transform: scale(0.98);
}
.btn-primary {
background: var(--grad);
color: #032830;
box-shadow:
0 10px 30px -10px var(--glow),
inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.btn-primary:hover {
box-shadow:
0 18px 40px -10px var(--glow),
inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.btn-ghost {
border-color: var(--line-strong);
background: var(--surface);
color: var(--fg);
box-shadow: var(--sh-sm);
}
.btn-ghost:hover {
border-color: var(--accent);
}
.i-check,
[data-state='copied'] .i-link {
display: none;
}
[data-state='copied'] .i-check {
display: block;
}
[data-state='copied'] {
border-color: var(--accent);
color: var(--accent);
}
.wait {
position: relative;
aspect-ratio: 16 / 9;
place-content: center;
justify-items: center;
gap: 18px;
overflow: hidden;
padding: 24px;
text-align: center;
}
.wait::before {
content: '';
position: absolute;
inset: 0;
background: linear-gradient(100deg, transparent 30%, var(--accent-soft) 50%, transparent 70%);
transform: translateX(-100%);
animation: sweep 2.4s var(--ease-out-soft) infinite;
}
@keyframes sweep {
to {
transform: translateX(100%);
}
}
.wait p {
position: relative;
display: grid;
gap: 4px;
color: var(--fg-2);
font-size: 15px;
}
.wait strong {
color: var(--fg);
font: 700 19px/1.3 var(--font-display);
letter-spacing: -0.02em;
}
.spinner {
position: relative;
width: 36px;
height: 36px;
border: 3px solid var(--accent-soft);
border-top-color: var(--accent);
border-radius: 50%;
animation: spin 0.9s linear infinite;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}
.missing {
margin: auto 0;
padding: 24px 0 8px;
display: grid;
justify-items: center;
gap: 14px;
max-width: 520px;
text-align: center;
}
.missing > p {
color: var(--fg-2);
font-size: 17px;
}
.missing .btn {
margin-top: 14px;
}
.made {
padding: 8px 16px 32px;
text-align: center;
font-size: 13px;
}
.made a {
display: inline-flex;
align-items: center;
gap: 6px;
color: var(--fg-3);
text-decoration: none;
transition: color 300ms ease;
}
.made a:hover {
color: var(--accent);
}
.made svg {
width: 16px;
height: 16px;
}
@keyframes rise {
from {
opacity: 0;
transform: translateY(22px);
}
to {
opacity: 1;
transform: none;
}
}
.rise {
animation: rise 1s var(--ease-out-soft) both;
animation-delay: var(--d, 0s);
}
::view-transition-old(root),
::view-transition-new(root) {
animation: none;
mix-blend-mode: normal;
}
@media (min-width: 640px) {
.bar {
padding: 0 24px;
}
main {
padding: 28px 24px 48px;
}
.full-fit {
--m: 24px;
}
.full-close {
top: 20px;
right: 24px;
}
}
@media (max-height: 560px) {
.bar {
height: 52px;
}
main {
padding-top: 8px;
padding-bottom: 12px;
}
.stage,
.actions {
margin-top: 14px;
}
.stage[data-fitted] {
min-height: min(160px, var(--nh));
}
.made {
padding: 4px 16px 12px;
}
}
@media (max-width: 479px) {
.actions {
width: 100%;
}
.actions .btn {
flex: 1;
}
}
@media (prefers-reduced-motion: reduce) {
*,
*::before,
*::after {
animation-duration: 0.01ms !important;
animation-delay: 0s !important;
animation-iteration-count: 1 !important;
transition-duration: 0.01ms !important;
transition-delay: 0s !important;
}
.btn:hover {
translate: none;
}
.wait::before {
display: none;
}
}
</style>

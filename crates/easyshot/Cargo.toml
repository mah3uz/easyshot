[package]
name = "easyshot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "easyshot"
path = "src/main.rs"

[dependencies]
es-geom.workspace = true
es-model.workspace = true
es-protocol.workspace = true
es-store.workspace = true
es-desktop.workspace = true
es-record.workspace = true
es-backend.workspace = true
es-ui = { workspace = true, optional = true }
es-app = { workspace = true, optional = true }
es-editor = { workspace = true, optional = true }
es-overlays = { workspace = true, optional = true }
es-shell = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
ctrlc.workspace = true
async-channel.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support", "bench-support"] }
gpui_platform = { workspace = true, features = ["test-support", "bench-support"] }
es-testkit.workspace = true
xkbcommon.workspace = true
es-desktop = { workspace = true, features = ["test-hooks"] }
tempfile.workspace = true
image.workspace = true

[features]
gui = ["dep:gpui", "dep:gpui_platform", "dep:es-ui", "dep:es-app", "dep:es-editor", "dep:es-overlays", "dep:es-shell", "dep:gpui-component", "dep:rayon", "dep:time", "dep:uuid"]
default = ["gui", "es-backend/hyprland", "es-backend/wlroots", "es-backend/niri"]
hyprland = ["es-backend/hyprland"]
wlroots = ["es-backend/wlroots"]
niri = ["es-backend/niri"]
player = ["es-overlays?/player"]
sound = ["es-desktop/sound"]
evdev-input = ["es-record/evdev-input"]
test-hooks = ["es-backend/test-hooks", "es-desktop/test-hooks", "es-app?/test-hooks"]
dev-inspector = ["es-ui?/dev-inspector"]
